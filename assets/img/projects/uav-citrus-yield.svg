<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16211a"/>
      <stop offset="1" stop-color="#1f2e24"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fa07a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fa07a" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <!-- orchard rows of citrus trees, aerial view -->
  <g>
    <g transform="translate(0,120)">
      <circle cx="90" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="190" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="290" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="390" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="490" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="590" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="690" cy="0" r="26" fill="url(#canopy)"/>
    </g>
    <g transform="translate(50,220)">
      <circle cx="90" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="190" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="290" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="390" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="490" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="590" cy="0" r="26" fill="url(#canopy)"/>
    </g>
    <g transform="translate(0,320)">
      <circle cx="90" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="190" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="290" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="390" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="490" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="590" cy="0" r="26" fill="url(#canopy)"/>
      <circle cx="690" cy="0" r="26" fill="url(#canopy)"/>
    </g>
  </g>
  <!-- detection boxes around a few fruit-bearing canopies -->
  <g stroke="#c9a24a" stroke-width="2" fill="none">
    <rect x="164" y="94" width="52" height="52"/>
    <rect x="364" y="94" width="52" height="52"/>
    <rect x="314" y="294" width="52" height="52"/>
  </g>
  <!-- drone -->
  <g transform="translate(650,80)">
    <circle r="10" fill="#f5f3ec"/>
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="#f5f3ec" stroke-width="2"/>
    <line x1="24" y1="-24" x2="-24" y2="24" stroke="#f5f3ec" stroke-width="2"/>
    <circle cx="-24" cy="-24" r="6" fill="#f5f3ec"/>
    <circle cx="24" cy="-24" r="6" fill="#f5f3ec"/>
    <circle cx="-24" cy="24" r="6" fill="#f5f3ec"/>
    <circle cx="24" cy="24" r="6" fill="#f5f3ec"/>
  </g>
  <line x1="650" y1="95" x2="500" y2="200" stroke="#f5f3ec" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
</svg>
