<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16211a"/>
      <stop offset="1" stop-color="#1f2e24"/>
    </linearGradient>
    <linearGradient id="spec3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7f9e"/>
      <stop offset="0.28" stop-color="#7fa07a"/>
      <stop offset="0.55" stop-color="#c9a24a"/>
      <stop offset="0.78" stop-color="#c0703f"/>
      <stop offset="1" stop-color="#8a3f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- landscape grid (satellite tiling) -->
  <g stroke="#e4c893" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="60" x2="160" y2="440"/>
    <line x1="320" y1="60" x2="320" y2="440"/>
    <line x1="480" y1="60" x2="480" y2="440"/>
    <line x1="640" y1="60" x2="640" y2="440"/>
  </g>
  <!-- a few tiles "reconstructed" by the model, filled in -->
  <rect x="320" y="200" width="160" height="80" fill="#7fa07a" opacity="0.3"/>
  <rect x="480" y="280" width="160" height="80" fill="#7fa07a" opacity="0.18"/>
  <!-- orbiting satellite path -->
  <ellipse cx="400" cy="250" rx="330" ry="110" fill="none" stroke="url(#spec3)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="705" cy="230" r="7" fill="#f5f3ec"/>
  <line x1="705" y1="230" x2="690" y2="255" stroke="#f5f3ec" stroke-width="1.5"/>
  <line x1="705" y1="230" x2="722" y2="252" stroke="#f5f3ec" stroke-width="1.5"/>
</svg>
