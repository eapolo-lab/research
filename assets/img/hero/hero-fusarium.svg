<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16211a"/>
      <stop offset="1" stop-color="#1f2e24"/>
    </linearGradient>
    <linearGradient id="spec2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7f9e"/>
      <stop offset="0.28" stop-color="#7fa07a"/>
      <stop offset="0.55" stop-color="#c9a24a"/>
      <stop offset="0.78" stop-color="#c0703f"/>
      <stop offset="1" stop-color="#8a3f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- cereal rows in perspective -->
  <g stroke="#e4c893" stroke-width="1.4" opacity="0.55">
    <line x1="80" y1="460" x2="260" y2="90"/>
    <line x1="220" y1="460" x2="330" y2="90"/>
    <line x1="360" y1="460" x2="400" y2="90"/>
    <line x1="500" y1="460" x2="470" y2="90"/>
    <line x1="640" y1="460" x2="540" y2="90"/>
    <line x1="760" y1="460" x2="610" y2="90"/>
  </g>
  <!-- push-broom scan band sweeping over the rows -->
  <rect x="0" y="230" width="800" height="34" fill="url(#spec2)" opacity="0.85"/>
  <rect x="0" y="230" width="800" height="1" fill="#f5f3ec" opacity="0.6"/>
  <rect x="0" y="264" width="800" height="1" fill="#f5f3ec" opacity="0.6"/>
  <!-- infection markers -->
  <circle cx="300" cy="247" r="5" fill="#f5f3ec"/>
  <circle cx="470" cy="247" r="5" fill="#f5f3ec"/>
  <circle cx="600" cy="247" r="5" fill="#f5f3ec"/>
</svg>
