<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16211a"/>
      <stop offset="1" stop-color="#1f2e24"/>
    </linearGradient>
    <linearGradient id="spec1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7f9e"/>
      <stop offset="0.28" stop-color="#7fa07a"/>
      <stop offset="0.55" stop-color="#c9a24a"/>
      <stop offset="0.78" stop-color="#c0703f"/>
      <stop offset="1" stop-color="#8a3f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- fruit cross-section -->
  <circle cx="400" cy="230" r="150" fill="none" stroke="#e4c893" stroke-width="1.5" opacity="0.5"/>
  <circle cx="400" cy="230" r="105" fill="none" stroke="#e4c893" stroke-width="1.5" opacity="0.35"/>
  <circle cx="400" cy="230" r="60" fill="none" stroke="#e4c893" stroke-width="1.5" opacity="0.25"/>
  <!-- disorder blotches (hidden internal damage) -->
  <ellipse cx="360" cy="190" rx="22" ry="15" fill="#8a3f3f" opacity="0.55"/>
  <ellipse cx="440" cy="260" rx="16" ry="11" fill="#8a3f3f" opacity="0.4"/>
  <!-- scan line sweeping across -->
  <rect x="150" y="410" width="500" height="6" fill="url(#spec1)"/>
  <g stroke="#f5f3ec" stroke-width="1" opacity="0.5">
    <line x1="150" y1="400" x2="150" y2="420"/>
    <line x1="250" y1="400" x2="250" y2="420"/>
    <line x1="350" y1="400" x2="350" y2="420"/>
    <line x1="450" y1="400" x2="450" y2="420"/>
    <line x1="550" y1="400" x2="550" y2="420"/>
    <line x1="650" y1="400" x2="650" y2="420"/>
  </g>
  <line x1="400" y1="80" x2="400" y2="410" stroke="#e4c893" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
</svg>
