<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orly Enrique Apolo-Apolo, PhD — Researcher</title>
<meta name="description" content="Researcher working on AI, hyperspectral imaging and remote sensing for agri-food systems.">

<link rel="icon" type="image/png" href="assets/img/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="masthead" id="top">
  <div class="wrap nav-row">
    <a href="#top" class="brand" id="brandLink"></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 1H18" stroke="currentColor" stroke-width="1.6"/>
        <path d="M0 7H18" stroke="currentColor" stroke-width="1.6"/>
        <path d="M0 13H18" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
    <nav class="site-nav" id="siteNav">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#interviews">Interviews</a></li>
        <li><a id="navCv" href="#" target="_blank" rel="noopener">CV</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>

  <!-- Photo reel: a scrolling filmstrip of research imagery -->
  <div class="reel-strip">
    <div class="reel-track" id="reelTrack"></div>
  </div>

  <div class="stats-row">
    <div class="wrap" id="statsRow"></div>
  </div>
</header>

<main>

  <!-- About: personal intro card -->
  <section id="about" class="intro-section">
    <div class="wrap intro-grid">
      <aside class="intro-side">
        <div class="photo-swap">
          <img id="heroPhoto" src="assets/img/profile.png" alt="">
          <img id="heroPhotoHover" alt="" aria-hidden="true">
        </div>
        <div class="intro-side-text">
          <h1 id="introName"></h1>
          <div id="introRoleLines"></div>
          <div class="social-row" id="socialRowTop"></div>
        </div>
      </aside>
      <div class="intro-main">
        <h2 id="greeting"></h2>
        <div id="bioText"></div>
        <div class="interests-row" id="interestsRow"></div>
      </div>
    </div>
  </section>

  <!-- Publications -->
  <section id="publications">
    <div class="wrap">
      <div class="section-head">
        <h2>Publications</h2>
        <span class="count" id="pubCount"></span>
      </div>
      <div class="pub-controls">
        <div class="pub-filters" id="pubFilters"></div>
        <input type="search" class="pub-search" id="pubSearch" placeholder="Search by title, author or year">
      </div>
      <div id="pubResults"></div>
    </div>
  </section>

  <!-- Projects -->
  <section id="projects">
    <div class="wrap">
      <div class="section-head"><h2>Research projects</h2></div>
      <div class="project-list" id="projectList"></div>
    </div>
  </section>

  <!-- Interviews -->
  <section id="interviews">
    <div class="wrap">
      <div class="section-head"><h2>Interviews</h2></div>
      <div class="interview-grid" id="interviewGrid"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="contact">
  <div class="wrap contact-grid">
    <div>
      <h4>Location</h4>
      <p id="contactAddress"></p>
    </div>
    <div>
      <h4>Get in touch</h4>
      <p><a id="contactEmail" href="#"></a></p>
      <p><a id="contactPhone" href="#"></a></p>
    </div>
    <div>
      <h4>Elsewhere</h4>
      <div class="social-row" id="socialRow"></div>
    </div>
  </div>
  <div class="wrap footer-base">
    <span id="footerName"></span>
    <span>Built as a static site — hosted on GitHub Pages.</span>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
